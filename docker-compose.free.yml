version: '3.8'

services:
  # API Gateway (Node.js/Express)
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: myntra-api-gateway
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_HOST: ${MONGODB_HOST}
      MONGODB_PORT: ${MONGODB_PORT:-27017}
      MONGODB_USER: ${MONGODB_USER}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD}
      MONGODB_DB: ${MONGODB_DB:-myntra_dashboard}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NLP_SERVICE_URL: http://nlp-service:8000
      ANALYTICS_SERVICE_URL: http://analytics-service:8001
      DATA_INGESTION_SERVICE_URL: http://data-ingestion:8002
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    depends_on:
      - nlp-service
      - data-ingestion
      - analytics-service
    networks:
      - myntra-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  # Data Ingestion Service (Python/FastAPI)
  data-ingestion:
    build:
      context: ./backend/data-ingestion
      dockerfile: Dockerfile
    container_name: myntra-data-ingestion
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-require}
      MONGODB_HOST: ${MONGODB_HOST}
      MONGODB_PORT: ${MONGODB_PORT:-27017}
      MONGODB_USER: ${MONGODB_USER}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD}
      MONGODB_DB: ${MONGODB_DB:-myntra_dashboard}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      NLP_SERVICE_URL: http://nlp-service:8000
    depends_on:
      - nlp-service
    networks:
      - myntra-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  # NLP Processing Service (Python/FastAPI) - lightweight
  nlp-service:
    build:
      context: ./backend/nlp-service
      dockerfile: Dockerfile
    container_name: myntra-nlp-service
    environment:
      MONGODB_HOST: ${MONGODB_HOST}
      MONGODB_PORT: ${MONGODB_PORT:-27017}
      MONGODB_USER: ${MONGODB_USER}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD}
      MONGODB_DB: ${MONGODB_DB:-myntra_dashboard}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/0
    networks:
      - myntra-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  # Analytics & Aggregation Service (Python/FastAPI)
  analytics-service:
    build:
      context: ./backend/analytics-service
      dockerfile: Dockerfile
    container_name: myntra-analytics-service
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-require}
      MONGODB_HOST: ${MONGODB_HOST}
      MONGODB_PORT: ${MONGODB_PORT:-27017}
      MONGODB_USER: ${MONGODB_USER}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD}
      MONGODB_DB: ${MONGODB_DB:-myntra_dashboard}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      - nlp-service
    networks:
      - myntra-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  # Caddy reverse proxy for the API only
  caddy:
    image: caddy:2-alpine
    container_name: myntra-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.backend:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      API_DOMAIN: ${API_DOMAIN}
    depends_on:
      - api-gateway
    networks:
      - myntra-network
    restart: unless-stopped

networks:
  myntra-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
