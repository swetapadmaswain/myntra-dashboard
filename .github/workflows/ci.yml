name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          cd frontend && npm ci
          cd ../backend/api-gateway && npm ci
      
      - name: Run ESLint
        run: |
          cd frontend && npm run lint
          cd ../backend/api-gateway && npm run lint
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Python dependencies
        run: |
          cd backend/data-ingestion && pip install -r requirements.txt
          cd ../nlp-service && pip install -r requirements.txt
          cd ../analytics-service && pip install -r requirements.txt
      
      - name: Run Black
        run: |
          cd backend/data-ingestion && black --check .
          cd ../nlp-service && black --check .
          cd ../analytics-service && black --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          cd frontend && npm ci
      
      - name: Run frontend tests
        run: |
          cd frontend && npm test
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Python dependencies
        run: |
          cd backend/data-ingestion && pip install -r requirements.txt
          cd ../nlp-service && pip install -r requirements.txt
          cd ../analytics-service && pip install -r requirements.txt
      
      - name: Run Python tests
        run: |
          cd backend/data-ingestion && pytest
          cd ../nlp-service && pytest
          cd ../analytics-service && pytest

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker images
        run: |
          docker-compose -f docker-compose.yml build
