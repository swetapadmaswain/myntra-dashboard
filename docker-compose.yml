version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: myntra-postgres
    environment:
      POSTGRES_DB: myntra_dashboard
      POSTGRES_USER: myntra_user
      POSTGRES_PASSWORD: myntra_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - myntra-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myntra_user -d myntra_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: myntra-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: myntra_user
      MONGO_INITDB_ROOT_PASSWORD: myntra_password
      MONGO_INITDB_DATABASE: myntra_dashboard
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - myntra-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: myntra-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - myntra-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Elasticsearch
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: myntra-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - myntra-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # API Gateway (Node.js/Express)
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: myntra-api-gateway
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: myntra_dashboard
      POSTGRES_USER: myntra_user
      POSTGRES_PASSWORD: myntra_password
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_USER: myntra_user
      MONGODB_PASSWORD: myntra_password
      MONGODB_DB: myntra_dashboard
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
      NLP_SERVICE_URL: http://nlp-service:8000
      ANALYTICS_SERVICE_URL: http://analytics-service:8001
      DATA_INGESTION_SERVICE_URL: http://data-ingestion:8002
      JWT_SECRET: your-jwt-secret-key-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - myntra-network

  # Data Ingestion Service (Python/FastAPI)
  data-ingestion:
    build:
      context: ./backend/data-ingestion
      dockerfile: Dockerfile
    container_name: myntra-data-ingestion
    ports:
      - "8002:8002"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: myntra_dashboard
      POSTGRES_USER: myntra_user
      POSTGRES_PASSWORD: myntra_password
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_USER: myntra_user
      MONGODB_PASSWORD: myntra_password
      MONGODB_DB: myntra_dashboard
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      NLP_SERVICE_URL: http://nlp-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - myntra-network
    volumes:
      - ./backend/data-ingestion:/app

  # NLP Processing Service (Python/FastAPI)
  nlp-service:
    build:
      context: ./backend/nlp-service
      dockerfile: Dockerfile
    container_name: myntra-nlp-service
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: myntra_dashboard
      POSTGRES_USER: myntra_user
      POSTGRES_PASSWORD: myntra_password
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_USER: myntra_user
      MONGODB_PASSWORD: myntra_password
      MONGODB_DB: myntra_dashboard
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - myntra-network
    volumes:
      - ./backend/nlp-service:/app
      - ./backend/nlp-service/models:/app/models

  # Analytics & Aggregation Service (Python/FastAPI)
  analytics-service:
    build:
      context: ./backend/analytics-service
      dockerfile: Dockerfile
    container_name: myntra-analytics-service
    ports:
      - "8001:8001"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: myntra_dashboard
      POSTGRES_USER: myntra_user
      POSTGRES_PASSWORD: myntra_password
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_USER: myntra_user
      MONGODB_PASSWORD: myntra_password
      MONGODB_DB: myntra_dashboard
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - myntra-network
    volumes:
      - ./backend/analytics-service:/app

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: myntra-frontend
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:3000
    depends_on:
      - api-gateway
    networks:
      - myntra-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

networks:
  myntra-network:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  mongodb_config:
  redis_data:
  elasticsearch_data:
